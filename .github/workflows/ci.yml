name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: ubuntu-latest
            name: linux-x64
          - os: macos-latest
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run package
      - name: Archive
        shell: bash
        working-directory: out
        run: |
          dir=$(ls -d Comet-*)
          case "$RUNNER_OS" in
            Windows) 7z a -tzip ../comet-${{ matrix.name }}.zip "$dir" ;;
            macOS) ditto -c -k --keepParent "$dir" ../comet-${{ matrix.name }}.zip ;;
            Linux) tar -czf ../comet-${{ matrix.name }}.tar.gz "$dir" ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: comet-${{ matrix.name }}
          path: comet-${{ matrix.name }}.*
          compression-level: 0
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --no-daemon
        working-directory: client
      - uses: actions/upload-artifact@v4
        with:
          name: comet-client
          path: client/build/dist/*.jar
